<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" fill="none">
  <defs>
    <!-- Studio warm radial background matching the uploaded portrait -->
    <radialGradient id="studioBg" cx="50%" cy="42%" r="65%" fx="50%" fy="42%">
      <stop offset="0%" stop-color="#F5EFE6" />
      <stop offset="45%" stop-color="#DDD6CC" />
      <stop offset="85%" stop-color="#BEB8B0" />
      <stop offset="100%" stop-color="#A59F97" />
    </radialGradient>

    <!-- Skin tone gradients with realistic studio lighting -->
    <linearGradient id="skinFace" x1="180" y1="120" x2="410" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9926E" />
      <stop offset="48%" stop-color="#B57B56" />
      <stop offset="85%" stop-color="#986240" />
      <stop offset="100%" stop-color="#7E4E30" />
    </linearGradient>

    <linearGradient id="skinNeck" x1="250" y1="330" x2="360" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9F6947" />
      <stop offset="50%" stop-color="#8C5838" />
      <stop offset="100%" stop-color="#744528" />
    </linearGradient>

    <linearGradient id="skinHand" x1="130" y1="640" x2="240" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B37A56" />
      <stop offset="100%" stop-color="#8A5636" />
    </linearGradient>

    <!-- Hair gradient -->
    <linearGradient id="hairGrad" x1="200" y1="40" x2="380" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D1B1A" />
      <stop offset="40%" stop-color="#121010" />
      <stop offset="100%" stop-color="#252220" />
    </linearGradient>

    <!-- Charcoal suit gradients -->
    <linearGradient id="suitBody" x1="80" y1="380" x2="520" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#585B5E" />
      <stop offset="45%" stop-color="#45484B" />
      <stop offset="85%" stop-color="#35383B" />
      <stop offset="100%" stop-color="#282A2D" />
    </linearGradient>

    <linearGradient id="suitLapelLeft" x1="170" y1="380" x2="290" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#606366" />
      <stop offset="60%" stop-color="#4A4D50" />
      <stop offset="100%" stop-color="#383A3D" />
    </linearGradient>

    <linearGradient id="suitLapelRight" x1="420" y1="380" x2="290" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#55585B" />
      <stop offset="60%" stop-color="#414447" />
      <stop offset="100%" stop-color="#313336" />
    </linearGradient>

    <!-- Crisp light blue dress shirt -->
    <linearGradient id="shirtBlue" x1="230" y1="350" x2="370" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DCE8F2" />
      <stop offset="50%" stop-color="#C5D7E7" />
      <stop offset="100%" stop-color="#A8BFD4" />
    </linearGradient>

    <linearGradient id="shirtCollar" x1="220" y1="340" x2="380" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EBF3FA" />
      <stop offset="100%" stop-color="#C2D5E6" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.22" />
    </filter>

    <filter id="subtleBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="600" height="760" fill="url(#studioBg)" />

  <!-- Soft warm studio halo behind head & shoulders -->
  <ellipse cx="300" cy="310" rx="220" ry="210" fill="#FFF9F0" opacity="0.45" filter="url(#subtleBlur)" />

  <!-- Neck & Collar Shadow -->
  <path d="M242 320 L238 415 L362 415 L358 320 Z" fill="url(#skinNeck)" />
  <ellipse cx="300" cy="348" rx="58" ry="26" fill="#63381E" opacity="0.35" />

  <!-- Dress Shirt Inner Base -->
  <path d="M222 365 L300 650 L378 365 L358 355 L300 422 L242 355 Z" fill="url(#shirtBlue)" />

  <!-- Shirt Placket & Buttons -->
  <path d="M289 418 L311 418 L307 640 L293 640 Z" fill="#D5E3F0" stroke="#B3C8DC" stroke-width="1" />
  <!-- Button 1 -->
  <circle cx="298" cy="472" r="5.5" fill="#F4F8FC" stroke="#9FB5C9" stroke-width="1.2" />
  <circle cx="296.5" cy="470.5" r="1" fill="#7D96AC" />
  <circle cx="299.5" cy="473.5" r="1" fill="#7D96AC" />
  <!-- Button 2 -->
  <circle cx="295" cy="574" r="5.5" fill="#F4F8FC" stroke="#9FB5C9" stroke-width="1.2" />
  <circle cx="293.5" cy="572.5" r="1" fill="#7D96AC" />
  <circle cx="296.5" cy="575.5" r="1" fill="#7D96AC" />

  <!-- Shirt Collar Left & Right -->
  <path d="M238 338 L222 385 L267 438 L296 412 L254 366 Z" fill="url(#shirtCollar)" filter="url(#softShadow)" />
  <path d="M362 338 L378 385 L333 438 L304 412 L346 366 Z" fill="url(#shirtCollar)" filter="url(#softShadow)" />

  <!-- Main Suit Torso & Shoulders -->
  <path d="M44 505 C52 442 92 412 162 390 L226 362 L292 645 L308 645 L374 362 L438 390 C508 412 548 442 556 505 L582 760 L18 760 Z" fill="url(#suitBody)" />

  <!-- Suit Breast Pocket (Viewer's Right) -->
  <path d="M366 550 L476 534 L478 558 L368 574 Z" fill="#373A3D" stroke="#292B2E" stroke-width="1.5" />

  <!-- Suit Lapels -->
  <!-- Left Lapel -->
  <path d="M224 360 L178 408 L194 452 L166 472 L272 678 L294 645 Z" fill="url(#suitLapelLeft)" filter="url(#softShadow)" />
  <!-- Right Lapel -->
  <path d="M376 360 L422 408 L406 452 L434 472 L302 688 L286 645 Z" fill="url(#suitLapelRight)" filter="url(#softShadow)" />
  <!-- Lapel buttonhole detail -->
  <line x1="382" y1="478" x2="404" y2="490" stroke="#2A2C2F" stroke-width="3" stroke-linecap="round" />

  <!-- Crossed Arms Structure -->
  <!-- Left Arm Sleeve coming across -->
  <path d="M22 520 L146 668 L360 668 L398 760 L16 760 Z" fill="#3D4043" />
  <!-- Hand peeking under arm on left -->
  <path d="M132 674 C158 666 198 668 232 674 L232 738 C196 742 152 736 126 724 Z" fill="url(#skinHand)" />
  <!-- Shirt Cuff peeking out by wristwatch -->
  <path d="M228 672 L248 670 L246 748 L224 744 Z" fill="#CFE0EE" />

  <!-- Wristwatch (Black dial with metallic bezel & markers matching photo) -->
  <g transform="translate(196, 668)">
    <!-- Watch strap top & bottom -->
    <path d="M12 -4 L34 -2 L36 14 L10 14 Z" fill="#1E1E20" />
    <path d="M10 66 L36 66 L32 84 L12 82 Z" fill="#18181A" />
    <!-- Metallic Case & Crown -->
    <circle cx="23" cy="40" r="29" fill="#D4D7DC" stroke="#8C9098" stroke-width="2" />
    <rect x="51" y="36" width="5" height="8" rx="1.5" fill="#C4C8CE" />
    <!-- Dark Watch Face -->
    <circle cx="23" cy="40" r="23" fill="#16181B" stroke="#454950" stroke-width="1.5" />
    <!-- Hour markers -->
    <line x1="23" y1="20" x2="23" y2="24" stroke="#E2E6EC" stroke-width="2" />
    <line x1="23" y1="56" x2="23" y2="60" stroke="#E2E6EC" stroke-width="2" />
    <line x1="3" y1="40" x2="7" y2="40" stroke="#E2E6EC" stroke-width="2" />
    <line x1="39" y1="40" x2="43" y2="40" stroke="#E2E6EC" stroke-width="2" />
    <line x1="9" y1="26" x2="12" y2="29" stroke="#C5CAD2" stroke-width="1.5" />
    <line x1="34" y1="51" x2="37" y2="54" stroke="#C5CAD2" stroke-width="1.5" />
    <line x1="37" y1="26" x2="34" y2="29" stroke="#C5CAD2" stroke-width="1.5" />
    <line x1="12" y1="51" x2="9" y2="54" stroke="#C5CAD2" stroke-width="1.5" />
    <!-- Watch hands -->
    <line x1="23" y1="40" x2="15" y2="29" stroke="#F0F4F8" stroke-width="2.2" stroke-linecap="round" />
    <line x1="23" y1="40" x2="34" y2="36" stroke="#F0F4F8" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="23" cy="40" r="2.2" fill="#E2E6EC" />
  </g>

  <!-- Foreground Right Arm Crossing Over -->
  <path d="M236 664 L496 638 L578 518 L588 760 L234 760 Z" fill="#46494D" filter="url(#softShadow)" />
  <path d="M236 668 L462 652" stroke="#5B5E63" stroke-width="2" opacity="0.6" />

  <!-- Ears -->
  <!-- Left Ear -->
  <path d="M192 206 C176 202 168 220 174 248 C179 272 190 286 204 282 Z" fill="#A66E4C" />
  <path d="M181 222 C178 236 183 258 194 268" stroke="#7A492B" stroke-width="3" stroke-linecap="round" />
  <!-- Right Ear -->
  <path d="M408 202 C424 198 432 216 426 244 C421 268 410 282 396 278 Z" fill="#9E6645" />
  <path d="M419 218 C422 232 417 254 406 264" stroke="#734326" stroke-width="3" stroke-linecap="round" />

  <!-- Head & Face Contour -->
  <path d="M198 158 C196 225 198 282 224 318 C246 348 274 364 300 364 C326 364 354 348 376 318 C402 282 404 225 402 158 C400 102 356 76 300 76 C244 76 200 102 198 158 Z" fill="url(#skinFace)" filter="url(#softShadow)" />

  <!-- Soft Cheek & Forehead Highlights -->
  <ellipse cx="250" cy="246" rx="34" ry="22" fill="#DDA784" opacity="0.28" filter="url(#subtleBlur)" />
  <ellipse cx="348" cy="246" rx="34" ry="22" fill="#DDA784" opacity="0.24" filter="url(#subtleBlur)" />
  <ellipse cx="312" cy="154" rx="56" ry="24" fill="#E0AC8B" opacity="0.25" filter="url(#subtleBlur)" />

  <!-- Eyebrows -->
  <path d="M218 196 C236 186 264 187 280 195" stroke="#1E1A18" stroke-width="6.5" stroke-linecap="round" />
  <path d="M320 194 C338 185 366 185 382 194" stroke="#1E1A18" stroke-width="6.5" stroke-linecap="round" />

  <!-- Eyes -->
  <!-- Left Eye -->
  <path d="M226 215 C239 205 261 205 274 216 C261 224 239 224 226 215 Z" fill="#F7F4F0" />
  <circle cx="251" cy="214" r="9.5" fill="#231815" />
  <circle cx="251" cy="214" r="4.5" fill="#0B0908" />
  <circle cx="254" cy="211" r="2.2" fill="#FFFFFF" />
  <path d="M224 214 C238 203 262 203 276 215" stroke="#1B1412" stroke-width="3.2" stroke-linecap="round" />
  <path d="M230 222 C242 227 258 227 270 221" stroke="#875334" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Right Eye -->
  <path d="M326 214 C339 204 361 204 374 215 C361 223 339 223 326 214 Z" fill="#F7F4F0" />
  <circle cx="349" cy="213" r="9.5" fill="#231815" />
  <circle cx="349" cy="213" r="4.5" fill="#0B0908" />
  <circle cx="352" cy="210" r="2.2" fill="#FFFFFF" />
  <path d="M324 213 C338 202 362 202 376 214" stroke="#1B1412" stroke-width="3.2" stroke-linecap="round" />
  <path d="M330 221 C342 226 358 226 370 220" stroke="#875334" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Nose -->
  <path d="M292 206 C290 232 282 256 276 268 C282 277 292 280 300 280 C308 280 318 277 324 268 C318 256 310 232 308 206" fill="#9E6644" opacity="0.32" />
  <path d="M299 208 L298 264" stroke="#D8A27E" stroke-width="3" stroke-linecap="round" opacity="0.45" />
  <path d="M275 267 C281 276 291 279 300 279 C309 279 319 276 325 267" stroke="#6E3F23" stroke-width="2.6" stroke-linecap="round" />
  <circle cx="285" cy="272" r="4.5" fill="#522D17" opacity="0.65" />
  <circle cx="315" cy="272" r="4.5" fill="#522D17" opacity="0.65" />

  <!-- Subtle Mustache -->
  <path d="M256 299 C270 287 288 287 300 292 C312 287 330 287 344 299 C332 295 314 295 300 298 C286 295 268 295 256 299 Z" fill="#231D1B" opacity="0.82" />
  <path d="M254 301 C268 290 286 290 300 294 C314 290 332 290 346 301" stroke="#1E1917" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />

  <!-- Warm Confident Smile & Lips -->
  <path d="M262 305 C276 300 290 302 300 303 C310 302 324 300 338 305 C325 311 275 311 262 305 Z" fill="#8C5246" />
  <path d="M264 306 C278 322 322 322 336 306 C324 312 276 312 264 306 Z" fill="#B57668" />
  <path d="M260 305 C278 311 322 311 340 305" stroke="#5E3127" stroke-width="2.2" stroke-linecap="round" />

  <!-- Subtle Chin Goatee / Jawline Beard Shadow -->
  <path d="M234 322 C254 352 278 362 300 362 C322 362 346 352 366 322 C350 346 326 355 300 355 C274 355 250 346 234 322 Z" fill="#211C1A" opacity="0.72" />
  <path d="M286 322 C294 326 306 326 314 322" stroke="#2A221F" stroke-width="2.5" stroke-linecap="round" opacity="0.45" />

  <!-- Neatly Styled Side-Swept Dark Hair (matching photo) -->
  <path d="M188 210 C180 162 184 114 214 82 C244 50 296 40 346 52 C382 60 408 86 416 122 C424 152 418 186 408 208 C404 176 398 148 386 128 C346 144 274 166 208 176 C202 190 198 202 196 214 Z" fill="url(#hairGrad)" />
  <!-- Hair Texture & Side Sweep Strands -->
  <path d="M210 154 C264 146 334 126 382 104" stroke="#2E2A28" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <path d="M204 134 C258 124 326 104 372 82" stroke="#35302E" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M222 108 C268 96 320 82 356 68" stroke="#2D2927" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>
